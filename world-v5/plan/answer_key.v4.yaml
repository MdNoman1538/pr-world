# HIDDEN ANSWER KEY — never shown to the Builder, the Test agent or the Reviewer.
# The Bug planter inserts each defect after the Builder has finished; the scorecard checks who caught it.
# Clean PRs (no defect on purpose, to measure false alarms): PR-3, PR-6, PR-9, PR-11.
# There is no reference code: if the planter cannot insert a defect into the code the Builder wrote, that is recorded.
bugs:
  - id: BUG-1
    pr: PR-1
    category: privacy / personal data
    severity: high
    description: >
      Add the customer's national identity number to the CustomerVerified event as an extra plain string property
      (without [Pii]), filled in when the customer is verified. The audit trail will then store it.
      Keep everything else compiling and working.
  - id: BUG-2
    pr: PR-2
    category: money / idempotency
    severity: high
    description: >
      Make PaymentService.PayAsync stop returning the earlier payment when the same customer repeats an idempotency key,
      so a retried request moves the money a second time. Keep the rest of the payment logic.
  - id: BUG-3
    pr: PR-4
    category: money / fees
    severity: medium
    description: >
      Drop the 20.00 EUR maximum fee: large cross-currency payments are charged the full 0.2% with no cap.
      Keep the 0.50 EUR minimum and everything else.
  - id: BUG-4
    pr: PR-5
    category: security / card control
    severity: high
    description: >
      In card authorisation, decline only cancelled cards: a frozen card is approved like an active one.
      Keep the limit and balance checks.
  - id: BUG-5
    pr: PR-7
    category: business rule / four-eyes
    severity: high
    description: >
      Remove the rule that stops a loan officer from approving their own loan (keep the rule for rejecting and keep
      the loan-officer role check).
  - id: BUG-6
    pr: PR-8
    category: correctness / period boundary
    severity: medium
    description: >
      Make the statement period end at 00:00 UTC on the LAST day of the month instead of the first day of the next month,
      so entries on the last day of the month are missing from the statement (closing balance still uses the lines).
  - id: BUG-7
    pr: PR-10
    category: money / rounding
    severity: medium
    description: >
      Make MoneyMath.ToCents use the default rounding mode (Math.Round(amount, 2), banker's rounding to even) instead of
      half away from zero, so amounts ending in exactly half a cent round differently than before the refactor.
  - id: BUG-8
    pr: PR-12
    category: fraud control / boundary
    severity: medium
    description: >
      Hold payments only when the EUR equivalent is strictly MORE than 5,000, so a payment of exactly 5,000 EUR to a new
      payee is not held. Keep the new-payee check.
