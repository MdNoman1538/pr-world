services:
  - type: web
    name: pr-world
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRW_SESSION_SECRET
        generateValue: true
      - key: PRW_SIGNING_SECRET
        generateValue: true
